services:
  db:
    image: pgvector/pgvector:pg16
    container_name: gaa_db
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: gaa
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gaa"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
